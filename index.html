<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Block Aero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/account.css?v=29">
  </head>
  <body>
    <a class="skip" href="#panel">Skip to sign in</a>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <div class="account" id="account" data-host="production">
      <div class="form-col">
        <div id="panel"></div>
      </div>
      <section class="stage" aria-label="Engine hangar">
        <img class="scene" src="assets/engine-hangar.jpg" alt="">
      </section>
    </div>
    <div class="review">
      <label>Screen
        <select id="rev-screen">
          <option value="sign-in">Sign in</option>
          <option value="sign-in-error">Sign in, incorrect password</option>
          <option value="forgot">Forgot password</option>
          <option value="sent">Reset email sent</option>
          <option value="email-code">Email code</option>
          <option value="email-code-invalid">Email code, invalid</option>
          <option value="email-code-expired">Email code, expired</option>
          <option value="auth-code">Authenticator</option>
          <option value="timeout">Link expired</option>
          <option value="done">Signed in</option>
          <option value="add-network">Add network, Block Aero</option>
          <option value="handoff">Handoff</option>
        </select>
      </label>
    </div>
    <div id="dialog-root"></div>
    <script src="js/account.js?v=31"></script>
  </body>
</html>
