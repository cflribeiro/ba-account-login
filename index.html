<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Block Aero - Sign In</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/account.css?v=110">
  </head>
  <body>
    <a class="skip" href="#panel">Skip to sign in</a>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <div class="account" id="account" data-host="production">
      <div class="form-col">
        <div id="panel"></div>
      </div>
      <section class="stage" aria-label="Engine hangar">
        <img class="scene" src="assets/engine-hangar-wide.jpg" alt="">
      </section>
    </div>
    <div class="review">
      <button type="button" class="review-toggle" id="rev-toggle" aria-label="Change review screen" aria-haspopup="listbox" aria-expanded="false" aria-controls="rev-menu">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="5" height="5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="9" y="2" width="5" height="5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2" y="9" width="5" height="5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="9" y="9" width="5" height="5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
      <div class="review-menu" id="rev-menu" role="listbox" aria-label="Review screens" hidden>
        <button type="button" role="option" data-screen="sign-in">Sign In</button>
        <button type="button" role="option" data-screen="sign-in-error">Sign In, incorrect credentials</button>
        <button type="button" role="option" data-screen="forgot">Reset Password</button>
        <button type="button" role="option" data-screen="sent">Reset email sent</button>
        <button type="button" role="option" data-screen="security">Security verification</button>
        <button type="button" role="option" data-screen="email-code">Email code</button>
        <button type="button" role="option" data-screen="email-code-invalid">Email code, invalid</button>
        <button type="button" role="option" data-screen="email-code-expired">Email code, expired</button>
        <button type="button" role="option" data-screen="auth-code">Authenticator</button>
        <button type="button" role="option" data-screen="timeout">Link expired</button>
        <button type="button" role="option" data-screen="handoff">Handoff</button>
      </div>
    </div>
    <script src="js/account.js?v=108"></script>
  </body>
</html>
